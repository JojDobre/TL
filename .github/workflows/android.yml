# Zostavenie Android appky Tifo (TWA) pre Google Play — spúšťa sa RUČNE.
# GitHub → Actions → "Android appka" → Run workflow → zadaj číslo verzie.
# Výsledný súbor .aab nájdeš v behu v časti Artifacts a nahráš ho do Play Console.
#
# Potrebné GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64   – súbor tifo-upload.jks zakódovaný v base64
#                               (Linux/Mac: base64 -w0 tifo-upload.jks, Windows: certutil -encode)
#   ANDROID_KEYSTORE_PASSWORD – heslo ku kľúču
#
# Obsah appky sa NEMENÍ pri každej zmene webu — appka zobrazuje tifo.sk, takže
# nová verzia v obchode treba len pri zmene ikony, názvu alebo Android nastavení.
name: Android appka

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Číslo zostavenia (celé číslo, vždy vyššie ako minule: 2, 3, 4…)'
        required: true
      version_name:
        description: 'Verzia pre ľudí (napr. 1.0.1)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kontrola nastavenia
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Chýbajú GitHub Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — návod je v android/README.md"
            exit 1
          fi
          if ! [[ "${{ inputs.version_code }}" =~ ^[0-9]+$ ]]; then echo "::error::version_code musí byť celé číslo"; exit 1; fi
      - name: Nastavenie verzie
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ inputs.version_code }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
      - name: Podpisový kľúč
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/tifo-upload.jks"
      - name: Zostavenie (.aab + .apk)
        env:
          TIFO_KEYSTORE: ${{ runner.temp }}/tifo-upload.jks
          TIFO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIFO_KEY_ALIAS: tifo-upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tifo-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Zmazanie kľúča z runnera
        if: always()
        run: rm -f "$RUNNER_TEMP/tifo-upload.jks"
