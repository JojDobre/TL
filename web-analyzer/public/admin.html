<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrácia | Web Analyzer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6M11 8v6"/></svg>
      </span>
      Administrácia
    </a>
    <nav class="nav" aria-label="Administrácia">
      <a href="/pristupnost">Web</a>
      <a href="#" id="logout" hidden>Odhlásiť</a>
    </nav>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Prepnúť tému">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>
  <main id="main">
    <form class="card admin-login" id="login" hidden>
      <h1 class="card-title">Prihlásenie</h1>
      <label for="token" class="sub">Prístupový kľúč (ADMIN_TOKEN zo servera)</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <button class="cta" type="submit">Prihlásiť</button>
      <p class="error" id="loginError" hidden></p>
    </form>
    <section class="bento" id="dash" hidden></section>
  </main>
</body>
</html>
