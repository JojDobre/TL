<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasca pre klávesnicu</title>
</head>
<body>
  <main>
    <h1>Pasca pre klávesnicu</h1>
    <p><a href="#a">Prvý odkaz</a></p>
    <p><label for="pasca">Pole, z ktorého sa nedá odísť</label> <input id="pasca" type="text"></p>
    <p><a href="#b">Odkaz za pascou</a></p>
  </main>
  <script>
    // CHYBA: wa-keyboard-trap – Tab sa zahodí, fokus ostane v poli
    document.getElementById('pasca').addEventListener('keydown', function (e) { if (e.key === 'Tab') e.preventDefault(); });
  </script>
</body>
</html>
