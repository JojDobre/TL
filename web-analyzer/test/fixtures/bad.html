<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zlá stránka – zámerne vložené chyby</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    a.nofocus { color: #000; text-decoration: none; }
    a.nofocus:focus { outline: none; }               /* CHYBA: wa-focus-visible */
    .low { color: #b5b5b5; background: #fff; }       /* CHYBA: color-contrast */
    .wide { width: 800px; background: #eee; }        /* CHYBA: wa-reflow */
    /* veľký prekryv (napr. newsletter/chat) – Chromium pri Tabe posúva prvok k stredu obrazovky */
    .bar { position: fixed; bottom: 0; left: 0; right: 0; height: 55vh; background: #222; color: #fff; padding: 16px; }
    .spacer { height: 1400px; }
  </style>
</head>
<body>                                                <!-- CHYBA: html-has-lang (chýba lang) -->
  <header><a href="#domov" class="nofocus">Domov bez viditeľného fokusu</a></header>
  <main>
    <h1>Testovacia stránka</h1>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="60" height="60"> <!-- CHYBA: image-alt -->
    <p class="low">Text so slabým kontrastom.</p>
    <input type="text" name="hladat">                 <!-- CHYBA: label -->
    <button type="button"><svg width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="8"/></svg></button> <!-- CHYBA: button-name -->
    <a href="/prazdny"></a>                            <!-- CHYBA: link-name -->
    <div class="clicky" onclick="this.textContent='OK'" style="cursor:pointer">Klikni na mňa</div> <!-- CHYBA: wa-not-focusable -->
    <div class="wide">Široký blok s pevnou šírkou 800 px</div>
    <div class="spacer"></div>
    <a href="#dole" id="pod-listou">Odkaz, ktorý po zameraní skončí pod lištou</a> <!-- CHYBA: wa-focus-obscured -->
    <div style="height: 300px"></div>
  </main>
  <div class="bar" role="note">Informačná lišta pevne prilepená na spodku obrazovky.</div>
</body>
</html>
